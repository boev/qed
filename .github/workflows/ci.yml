name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17@sha256:2203e6282d9e7de7c24d7da234e2a744fb325df366a3fd8ed940e8abbee39527
        env:
          POSTGRES_USER: qed
          POSTGRES_PASSWORD: qed-local-dev
          POSTGRES_DB: qed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qed -d qed_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Commands run from the repository root.
    env:
      QED_TEST_DATABASE_URL: postgres://qed:qed-local-dev@127.0.0.1:5432/qed_test
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install project Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Cache Cargo artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.98-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.98-
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Clippy with default features
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Clippy without default features
        run: cargo +1.98.0 clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Run database-backed test suite
        run: cargo +1.98.0 test --locked
      - name: Build release binary
        run: cargo +1.98.0 build --locked --release
